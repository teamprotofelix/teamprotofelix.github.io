<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>안녕봇 • 심사품질연구회</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap');

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Noto Sans KR', 'Orbitron', sans-serif;
        background: radial-gradient(ellipse at center, #0a0a23 0%, #000000 75%);
        color: #fff;
        min-height: 100vh;
        overflow-x: hidden;
    }

    /* 반짝이는 별 효과 */
    .stars {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
    }
    .star {
        position: absolute;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 0 6px #fff, 0 0 12px #00f5ff;
        animation: twinkle 1.8s infinite ease-in-out;
    }
    .star.small { width: 1.5px; height: 1.5px; }
    .star.medium { width: 2.5px; height: 2.5px; }
    .star.large { width: 3.5px; height: 3.5px; }

    @keyframes twinkle {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
    }

    .chat-container {
        max-width: 920px;
        margin: 30px auto;
        padding: 0 15px;
        position: relative;
        z-index: 2;
    }

    /* 상단 로고 이미지 */
    .logo-image {
        display: block;
        max-width: 500px;
        width: 100%;
        height: auto;
        margin: 0 auto 15px;
    }

    .chat-window {
        background: rgba(10, 10, 35, 0.92);
        border: 1px solid rgba(0, 229, 255, 0.35);
        border-radius: 24px;
        height: 620px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 0 30px rgba(0, 229, 255, 0.1);
    }

    .chat-header {
        padding: 16px 20px;
        background: rgba(0, 229, 255, 0.07);
        border-bottom: 1px solid rgba(0,229,255,0.25);
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .chat-messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .message {
        max-width: 85%;
        padding: 15px 18px;
        border-radius: 20px;
        line-height: 1.6;
        font-size: 1rem;
    }

    .bot-message {
        background: rgba(0, 229, 255, 0.1);
        border: 1px solid rgba(0, 229, 255, 0.3);
        align-self: flex-start;
    }

    .user-message {
        background: rgba(167, 139, 250, 0.15);
        border: 1px solid rgba(167, 139, 250, 0.4);
        align-self: flex-end;
    }

    .input-area {
        padding: 16px 18px;
        background: rgba(0,0,0,0.45);
        border-top: 1px solid rgba(0,229,255,0.2);
        display: flex;
        gap: 12px;
    }

    #user-input {
        flex: 1;
        padding: 14px 20px;
        background: rgba(255,255,255,0.07);
        border: 1px solid rgba(0,229,255,0.3);
        border-radius: 50px;
        color: white;
        font-size: 1rem;
    }

    #send-btn {
        padding: 14px 24px;
        background: linear-gradient(45deg, #00E5FF, #00B4D8);
        border: none;
        border-radius: 50px;
        color: #000;
        font-weight: 700;
        white-space: nowrap;
    }

    /* ==================== 모바일 최적화 ==================== */
    @media (max-width: 768px) {
        .chat-container {
            margin: 15px 10px;
            padding: 0 8px;
        }

        .logo-image {
            max-width: 220px;
            margin-bottom: 10px;
        }

        .chat-window {
            height: calc(100vh - 95px);   /* 모바일에서 화면을 최대한 활용 */
            border-radius: 18px;
        }

        .message {
            font-size: 1.05rem;
            padding: 14px 17px;
        }

        #user-input {
            font-size: 1.05rem;
            padding: 15px 18px;
        }

        #send-btn {
            padding: 15px 20px;
            font-size: 1rem;
        }
    }
</style>
</head>
<body>

    <!-- 반짝이는 별 배경 -->
    <div class="stars" id="stars"></div>

    <div class="chat-container">
        <!-- 로고 이미지 -->
        <img src="welcomebotlogo.jpg" alt="안녕봇" class="logo-image">

        <div class="chat-window">
            <div class="chat-header">
                <div style="width:11px;height:11px;background:#00E5FF;border-radius:50%;box-shadow:0 0 12px #00E5FF;"></div>
                <div><strong>안녕봇</strong> <span style="font-size:0.85rem;opacity:0.7;">— Grok 연결됨</span></div>
            </div>

            <div id="chat-messages" class="chat-messages"></div>

            <div class="input-area">
                <input type="text" id="user-input" placeholder="직원님, 어떤 도움이 필요하신가요?" onkeypress="if(event.key === 'Enter') sendMessage()">
                <button id="send-btn" onclick="sendMessage()">전송</button>
            </div>
        </div>
    </div>

<script>
    // 반짝이는 별 생성
    function createStars() {
        const container = document.getElementById('stars');
        const count = 160;

        for (let i = 0; i < count; i++) {
            const star = document.createElement('div');
            star.className = 'star';

            const size = Math.random();
            if (size < 0.6) star.classList.add('small');
            else if (size < 0.9) star.classList.add('medium');
            else star.classList.add('large');

            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDuration = (Math.random() * 2 + 1.3) + 's';
            star.style.animationDelay = Math.random() * 4 + 's';

            container.appendChild(star);
        }
    }
    createStars();

    // 챗봇 로직
    const chatMessages = document.getElementById('chat-messages');
    let messageHistory = [
        {
            role: "system",
            content: "너는 특허, 상표, 디자인 분야 심사품질담당관실의 전용 AI '안녕봇'이다. 직원들을 따뜻하고 정중하게 대하며, 심사품질 관련 질문에 전문적으로 답변한다."
        }
    ];

    function addMessage(content, isUser = false) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
        msgDiv.innerHTML = content;
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return msgDiv;
    }

    async function callGrokAPI(userMessage) {
        messageHistory.push({ role: "user", content: userMessage });

        try {
            const response = await fetch('/api/grok', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: "grok-4.20-0309-non-reasoning",
                    messages: messageHistory,
                    max_tokens: 50000,
                    temperature: 0.7
                })
            });

            const data = await response.json();
            if (data.error) throw new Error(data.error);

            const botReply = data.choices[0].message.content;
            messageHistory.push({ role: "assistant", content: botReply });
            return botReply;

        } catch (error) {
            console.error(error);
            return "죄송합니다. 현재 Grok API와 연결이 원활하지 않습니다. 잠시 후 다시 시도해 주세요.";
        }
    }

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const userText = input.value.trim();
        if (!userText) return;

        addMessage(userText, true);
        input.value = '';

        const loadingMsg = addMessage("안녕봇이 생각 중입니다...", false);
        const botReply = await callGrokAPI(userText);

        loadingMsg.remove();
        addMessage(botReply, false);
    }

    window.onload = function() {
        setTimeout(() => {
            const initialMsg = `직원님, 안녕하세요.<br>오늘도 심사품질을 지키는 소중한 하루가 되길 바랍니다.<br>무엇을 도와드릴까요?`;
            addMessage(initialMsg, false);
        }, 600);
    }
</script>
</body>
</html>
