<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>혜담이의 AI | 아림이의 AI</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Orbitron', monospace;
            background: radial-gradient(ellipse at center, #0a0a23 0%, #000 70%);
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
            cursor: none;
        }
        canvas { position: fixed; top: 0; left: 0; z-index: -1; }
        .cursor { position: fixed; width: 20px; height: 20px; background: radial-gradient(circle, #00E5FF, transparent); border-radius: 50%; pointer-events: none; z-index: 9999; mix-blend-mode: difference; }
        
        header {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            background-image: url('aicenter.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            background: rgba(0, 0, 0, 0.65);           /* 기존 0.6 → 0.65로 약간 진하게 */
            backdrop-filter: blur(15px);
            padding: 3.5rem 2.5rem 2.5rem 2.5rem;     /* 아래 패딩 줄임 */
            border-radius: 30px;
            border: 1px solid rgba(0, 229, 255, 0.2);  /* 0.3 → 0.2로 연하게 변경 */
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8),
                        inset 0 0 40px rgba(0, 229, 255, 0.08); /* inset 효과 약하게 조정 */
            max-width: 90%;
            animation: fadeInUp 1.5s ease-out;
        }

        .logo {
            font-size: clamp(3rem, 10vw, 6rem); 
            font-weight: 900;
            background: linear-gradient(45deg, #00E5FF, #A78BFA, #FF6B6B);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 50px rgba(0,229,255,0.8); 
            animation: glow 2s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 20px rgba(0,229,255,0.5));
            margin-bottom: 0.6rem;           /* ← 1rem → 0.6rem로 줄임 (가장 중요) */
            display: inline-block;
            padding-bottom: 0;
            border-bottom: none;
        }

        .header-subtitle {
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            opacity: 0.95;
            line-height: 1.4;
            max-width: 800px;
            margin: 0.8rem auto 0 auto;     /* ← margin-top을 0.8rem 정도로 조정 */
        }



        @keyframes fadeInUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes glow { 0% { text-shadow: 0 0 20px rgba(0,229,255,0.5); } 100% { text-shadow: 0 0 50px rgba(0,229,255,1); } }
        
        section { 
            padding: 80px 20px; 
            max-width: 1200px; 
            margin: 0 auto; 
            opacity: 0; 
            transform: translateY(50px); 
            transition: all 1s ease; 
        }
        section.visible { opacity: 1; transform: translateY(0); }
        
        h2 {
            font-size: 3rem; text-align: center; margin-bottom: 50px;
            background: linear-gradient(90deg, #00E5FF, #00B4D8, #A78BFA);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0,229,255,0.7); animation: pulse 3s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.8;} }

        .card {
            background: rgba(255,255,255,0.05); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(0,229,255,0.3);
            padding: 30px; 
            margin: 20px 0; 
            border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transform: perspective(1000px) rotateY(0deg); 
            transition: all 0.5s;
        }
        .card:hover { 
            transform: perspective(1000px) rotateY(10deg) translateZ(20px); 
            box-shadow: 0 30px 60px rgba(0,229,255,0.3); 
        }
        .icon-box { 
            font-size: 2.8rem; 
            color: #00E5FF; 
            margin-bottom: 1.2rem; 
            text-shadow: 0 0 25px rgba(0,229,255,0.6); 
        }

        .effect-list { list-style: none; }
        .effect-list li { 
            margin: 12px 0; 
            padding-left: 25px; 
            position: relative; 
        }
        .effect-list li::before { 
            content: '▸'; 
            color: #00E5FF; 
            font-weight: bold; 
            position: absolute; 
            left: 0; 
            animation: pulse 2s infinite; 
        }

        /* 버튼 스타일 (기존 유지) */
        .ai-bot-buttons { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; margin-bottom: 3rem; }
        .ai-bot-btn, .big-redirect-btn, .contest-btn {
            padding: 1.2rem 2rem; font-size: 1.2rem; font-weight: 700; border: none; border-radius: 15px;
            text-decoration: none; text-align: center; color: #fff; transition: all 0.4s; position: relative; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.9) !important;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 229, 255, 0.5);
        }
        .ai-bot-btn:hover {
            transform: translateY(-8px) scale(1.05); 
            box-shadow: 0 20px 50px rgba(0,229,255,0.5);
            filter: brightness(1.1); 
            color: #fff !important; 
            border-color: rgba(0,229,255,1);
        }

        .contest-btn {
            font-size: 1.6rem !important; padding: 1.5rem 3rem !important; border-radius: 25px !important;
            background: rgba(0,0,0,0.9) !important;
            border: 2px solid rgba(255,215,0,0.8) !important;
            box-shadow: 0 15px 40px rgba(255,215,0,0.3), 0 0 30px rgba(0,229,255,0.6) !important;
        }

        .big-redirect-btn {
            font-size: 2rem !important; padding: 1.5rem 4rem !important; border-radius: 50px !important;
            background: linear-gradient(135deg, #00E5FF, #A78BFA) !important; 
            box-shadow: 0 25px 50px rgba(0,229,255,0.6) !important;
        }

        .tpf-logo {
            max-width: 320px;
            filter: drop-shadow(0 0 35px rgba(0, 229, 255, 0.7));
            transition: all 0.5s ease;
            border-radius: 20px;
            border: 2px solid rgba(0, 229, 255, 0.3);
        }
        .tpf-logo:hover {
            transform: scale(1.08) rotate(2deg);
            filter: drop-shadow(0 0 50px rgba(0, 229, 255, 0.9));
            border-color: #00E5FF;
        }

        footer { 
            text-align: center; 
            padding: 60px 20px; 
            opacity: 0.75; 
            font-size: 0.95rem; 
            background: linear-gradient(to top, #000, transparent);
        }

        @media (max-width: 768px) {
            .big-redirect-btn { font-size: 1.3rem !important; padding: 1.2rem 2.5rem !important; width: 95% !important; max-width: 400px !important; }
            .ai-bot-buttons { gap: 0.5rem; flex-direction: column; }
            header { background-attachment: scroll; }
            .tpf-logo { max-width: 260px; }
        }

        /* ==================== 메인 로고 스타일 (신규) ==================== */
        .main-logo {
            max-width: 800px;
            width: 100%;
            display: block;
            margin: 0 auto 1.8rem auto;
            filter: drop-shadow(0 0 45px rgba(0, 229, 255, 0.85));
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            border-radius: 24px;
        }
        .main-logo:hover {
            transform: scale(1.06);
            filter: drop-shadow(0 0 70px rgba(0, 229, 255, 0.95));
        }
        .main-title {
            font-size: clamp(3.2rem, 9vw, 5.5rem);
            font-weight: 900;
            text-align: center;
            background: linear-gradient(90deg, #00E5FF, #A78BFA, #FF6B6B);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(0, 229, 255, 0.9),
                        0 0 80px rgba(167, 139, 250, 0.7),
                        0 0 120px rgba(255, 107, 107, 0.4);
            animation: glow 2.8s ease-in-out infinite alternate;
            margin-bottom: 0.8rem;
            letter-spacing: -2px;
        }

        .logo-link {
            display: inline-block; /* 클릭 영역 확보 */
            text-decoration: none; /* 밑줄 제거 */
            cursor: pointer; /* 손가락 커서 */
            transition: all 0.3s ease;
        }

        .logo-link:hover .logo {
            transform: scale(1.05); /* 살짝 확대 */
            filter: drop-shadow(0 0 30px rgba(0,229,255,1)); /* 네온 강조 */
            animation-duration: 1s; /* 호버 시 glow 속도 UP */
        }

        /* 공지사항 배너 스타일 */
        .notice-banner {
            display: block;
            width: 100%;
            max-width: 820px;
            margin: 0 auto;
            border-radius: 24px;
            overflow: hidden;
            text-decoration: none;
            position: relative;
            border: 1px solid rgba(0, 229, 255, 0.3);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .notice-banner:hover {
            transform: translateY(-12px) scale(1.02);
            box-shadow: 0 30px 70px rgba(0, 229, 255, 0.25);
            border-color: rgba(0, 229, 255, 0.6);
        }

        .notice-image-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #0a0a23;
            overflow: hidden;
        }

        .notice-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .notice-banner:hover .notice-image-wrapper img {
            transform: scale(1.08);
        }

        .notice-fallback {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: #00E5FF;
            background: rgba(10, 10, 35, 0.9);
        }

        .notice-fallback i {
            font-size: 3.5rem;
            text-shadow: 0 0 30px rgba(0, 229, 255, 0.6);
        }

        .notice-fallback span {
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff;
        }

        .notice-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 28px 30px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.75), transparent);
            display: flex;
            align-items: flex-end;
        }

        .notice-text {
            font-size: 1.65rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            letter-spacing: 0.5px;
        }



    </style>
</head>
<body>

    <canvas id="canvas"></canvas>
    <div class="cursor" id="cursor"></div>

    <!-- 헤더 -->


    <header>
        <div class="hero-content">
            <a href="#bots" class="logo-link">
                <img src="PGlogo.jpg" alt="PlayGround AI" class="main-logo">
                <h1 class="main-title">혜담·아림의 AI 센터</h1>
            </a>
            <p class="header-subtitle">
                언제나 즐겁고 행복한 <br>
                해담·아림을 위한 <strong>AI 동반자</strong>
            </p>
        </div>
    </header>



<section id="bots">
    <div style="max-width: 1000px; margin: 0 auto;">

        <!-- (16:9 + 인터랙션) -->
        <div style="margin: 3rem auto 2.5rem; text-align: center;">
            <a href="https://patent.moip.ai.kr/playground/arimbot.html" class="notice-banner">
                <div class="notice-image-wrapper">
                    <!-- 이미지 사용 -->

                    <!-- 이미지 없을 때 대체 콘텐츠 -->
                    <div class="notice-fallback">

                    <span class="notice-text">아림 봇</span>
                </div>
            </a>
        </div>

        <div style="text-align: center; margin-top: 3rem;">

            <div class="ai-bot-buttons">
                <a href="https://patent.moip.ai.kr/playground/arimbot.html" class="ai-bot-btn contest-btn">
                    <i class="fas fa-rocket"></i>아림 봇

            </div>
        </div>

        <div style="margin: 3rem auto 2.5rem; text-align: center;">
            <a href="https://patent.moip.ai.kr/playground/guri.html" class="notice-banner">
                <div class="notice-image-wrapper">
                    <!-- 이미지 사용 -->
                    <img src="guri.jpg" alt="개구리 봇"
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    
                    <!-- 이미지 없을 때 대체 콘텐츠 -->
                    <div class="notice-fallback">
                        <i class="fas fa-bullhorn"></i>
                        <span>개구리 봇</span>
                    </div>

                <!-- 오버레이 텍스트 -->
                <div class="notice-overlay">

                </div>
            </a>
        </div>


        <div style="text-align: center; margin-top: 3rem;">

            <div class="ai-bot-buttons">
                <a href="https://patent.moip.ai.kr/playground/guri.html" class="ai-bot-btn contest-btn">
                    <i class="fas fa-trophy"></i>🎉 개구리 봇 🎉
                </a>

            </div>
        </div>

        <div style="margin: 3rem auto 2.5rem; text-align: center;">
            <a href="/playground/album/index.html" class="notice-banner">
                <div class="notice-image-wrapper">
                    <!-- 이미지 사용 -->
                    <img src="challenge.jpg" alt="업적 달성"
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    
                    <!-- 이미지 없을 때 대체 콘텐츠 -->
                    <div class="notice-fallback">
                        <i class="fas fa-bullhorn"></i>
                        <span>업적 달성</span>
                    </div>
                </div>
                
                <!-- 오버레이 텍스트 -->
                <div class="notice-overlay">
                    <span class="notice-text">업적 달성</span>
                </div>
            </a>
        </div>


        <div style="text-align: center; margin-top: 3rem;">

            <div class="ai-bot-buttons">
                <a href="/playground/album/index.html" class="ai-bot-btn contest-btn">
                    <i class="fas fa-trophy"></i>🎉 업적 달성 🎉
                </a>

            </div>
        </div>




    <!-- 비전 -->
    <section id="vision">
        <h2><i class="fas fa-trophy"></i> 비전</h2>
        <div class="card" style="text-align: center;">
            <p style="font-size:1.25rem; line-height:1.6;">
                단순 보조 도구가 아닌,<br>
                <strong>살아있는 업무 동반자</strong>이자<br>
                <span style="background: linear-gradient(90deg, #00E5FF, #A78BFA); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                    존재론적 스케일의 지능 시스템
                </span>으로 진화합니다.
            </p>
            
            <div style="margin-top: 3rem;">
                <a href="https://protofelix.moip.ai.kr" target="_blank">
                    <img src="TPFlogo.jpg" alt="Team ProtoFelix" class="tpf-logo">
                </a>
                <p style="margin-top: 1.5rem; font-size: 1.5rem; font-weight: 700;">
                    AI 개발팀 <span style="background: linear-gradient(45deg, #FFD700, #FF6B6B); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">TeamProtoFelix</span>
                </p>
            </div>
        </div>
    </section>

    <!-- 푸터 -->
    <footer>
        &copy; 2026 혜담 아림의 AI는 TeamProtoFelix에서 설계 및 서비스 제공
    </footer>

    <script>
        // 파티클 효과
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; 
        canvas.height = window.innerHeight;
        let particles = [];
        
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.radius = Math.random() * 2 + 0.5;
                this.color = `hsl(${Math.random()*60 + 200}, 70%, 60%)`;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.save(); 
                ctx.globalAlpha = 0.8; 
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color; 
                ctx.shadowBlur = 12;
                ctx.beginPath(); 
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); 
                ctx.fill(); 
                ctx.restore();
            }
        }
        
        for (let i = 0; i < 200; i++) particles.push(new Particle());
        
        function animate() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        // 커서
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', e => {
            cursor.style.left = `${e.clientX}px`;
            cursor.style.top = `${e.clientY}px`;
        });

        // 스크롤 애니메이션
        const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => { 
                if (entry.isIntersecting) entry.target.classList.add('visible'); 
            });
        });
        document.querySelectorAll('section').forEach(sec => observer.observe(sec));

        // 리사이즈
        window.addEventListener('resize', () => { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
        });
    </script>
</body>
</html>
