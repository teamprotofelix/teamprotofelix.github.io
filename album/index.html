<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대전의 봄 - 사진 앨범</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%); 
            color: #333; 
            min-height: 100vh; 
            padding: 20px; 
        }
        .header { 
            text-align: center; 
            margin-bottom: 50px; 
            padding: 30px; 
            background: rgba(255,255,255,0.8); 
            border-radius: 25px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.1); 
        }
        h1 { 
            font-size: 3em; 
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4, #45b7d1); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            margin-bottom: 10px; 
            font-weight: 800; 
        }
        .subtitle { font-size: 1.4em; color: #666; }
        .gallery { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 25px; 
            max-width: 1600px; 
            margin: 0 auto; 
        }
        .item { 
            position: relative; 
            border-radius: 20px; 
            overflow: hidden; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); 
            transition: all 0.4s ease; 
            cursor: pointer; 
            height: 250px; 
            background: #f8f9fa; 
        }
        .item:hover { 
            transform: translateY(-12px) scale(1.03); 
            box-shadow: 0 30px 60px rgba(0,0,0,0.3); 
        }
        .item img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover;  /* 썸네일 crop 최적화 – 대용량 빠름 */
            display: block; 
            loading: lazy; 
        }
        .modal { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); 
            display: none; 
            justify-content: center; 
            align-items: center; 
            z-index: 1000; 
            padding: 20px; 
        }
        .modal img { 
            max-width: 95%; 
            max-height: 95%; 
            border-radius: 12px; 
            box-shadow: 0 0 60px rgba(255,255,255,0.3); 
            object-fit: contain; 
        }
        .close { 
            position: absolute; 
            top: 40px; right: 40px; 
            color: #fff; 
            font-size: 50px; 
            font-weight: bold; 
            cursor: pointer; 
            text-shadow: 0 0 15px rgba(255,255,255,0.8); 
            transition: 0.3s; 
        }
        .close:hover { color: #00E5FF; transform: scale(1.2); }
        .stats { 
            text-align: center; 
            font-size: 1.2em; 
            margin-top: 30px; 
            color: #666; 
        }
        @media (max-width: 768px) { 
            .gallery { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; } 
            h1 { font-size: 2.2em; } 
            .header { padding: 20px; margin-bottom: 30px; } 
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌸 대전의 봄</h1>
        <p class="subtitle">봄날의 추억을 담은 사진 앨범</p>
    </div>
    <div class="gallery" id="gallery"></div>
    <div class="stats" id="stats">60+ 사진 로딩 중...</div>
    <div class="modal" id="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <img id="modalImg" src="" alt="대전의 봄">
    </div>

    <script>
        // 모든 파일명 (은재님 목록 그대로!)
        const images = [
'DSC_5450.jpg', 'DSC_5452.jpg', 'DSC_5453.jpg', 'SAM_8023.jpg', 'SAM_8024.jpg', 'SAM_8025.jpg', 'SAM_8026.jpg', 'SAM_8027.jpg', 'SAM_8028.jpg', 'SAM_8029.jpg', 'SAM_8030.jpg', 'SAM_8031.jpg', 'SAM_8181.jpg', 'SAM_8182.jpg', 'SAM_8183.jpg', 'SAM_8184.jpg', 'SAM_8186.jpg', 'SAM_8187.jpg', 'SAM_8188.jpg', 'SAM_8189.jpg', 'SAM_8190.jpg', 'SAM_8191.jpg', 'SAM_8192.jpg', 'SAM_8193.jpg', 'SAM_8194.jpg', 'SAM_8195.jpg', 'SAM_8196.jpg', 'SAM_8197.jpg', 'SAM_8198.jpg', 'SAM_8200.jpg', 'SAM_8201.jpg', 'SAM_8202.jpg', 'SAM_8203.jpg', 'SAM_8204.jpg', 'SAM_8205.jpg', 'SAM_8206.jpg', 'SAM_8207.jpg', 'SAM_8209.jpg', 'SAM_8210.jpg', 'SAM_8212.jpg', 'SAM_8213.jpg', 'SAM_8235.jpg', 'SAM_8255.jpg', 'SAM_8257.jpg', 'SAM_8310.jpg', 'SAM_8311.jpg', 'SAM_8312.jpg', 'SAM_8313.jpg', 'SAM_8314.jpg', 'SAM_8315.jpg', 'SAM_8316.jpg', 'SAM_8317.jpg', 'SAM_8318.jpg', 'SAM_8319.jpg', 'SAM_8320.jpg', 'SAM_8466.jpg', 'SAM_8468.jpg', 'SAM_8470.jpg', 'SAM_8471.jpg', 'SAM_8473.jpg', 'SAM_8474.jpg', 'SAM_8475.jpg', 'SAM_8477.jpg', 'SAM_8479.jpg', 'SAM_8480.jpg', 'SAM_8481.jpg', 'SAM_8483.jpg', 'SAM_8485.jpg', 'SAM_8487.jpg', 'SAM_8489.jpg', 'SAM_8491.jpg', 'SAM_8493.jpg', 'SAM_8495.jpg', 'SAM_8497.jpg', 'SAM_8499.jpg', 'SAM_8501.jpg', 'SAM_8503.jpg', 'SAM_8505.jpg', 'SAM_8507.jpg', 'SAM_8509.jpg', 'SAM_8512.jpg', 'SAM_8514.jpg', 'SAM_8516.jpg', 'SAM_8518.jpg', 'SAM_8520.jpg', 'SAM_8522.jpg', 'SAM_8525.jpg', 'SAM_8527.jpg', 'SAM_8529.jpg', 'SAM_8531.jpg', 'SAM_8533.jpg', 'SAM_8535.jpg'
        ];

        const gallery = document.getElementById('gallery');
        const stats = document.getElementById('stats');

        images.forEach((filename, index) => {
            const item = document.createElement('div');
            item.className = 'item';
            item.onclick = () => openModal(`./${filename}`);
            item.innerHTML = `<img src="./${filename}" alt="${filename}" loading="lazy" onerror="this.parentNode.remove()">`;
            gallery.appendChild(item);
        });

        stats.textContent = `${images.length}장의 대전 봄 추억`;

        function openModal(src) {
            const modal = document.getElementById('modal');
            document.getElementById('modalImg').src = src;
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        document.addEventListener('keydown', (e) => e.key === 'Escape' && closeModal());
        document.getElementById('modal').onclick = (e) => e.target.classList.contains('modal') && closeModal();
    </script>
</body>
</html>
