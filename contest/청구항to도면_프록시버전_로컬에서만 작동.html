<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>청구범위to도면 변환봇</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        .patent-drawing { border: 2px solid #374151; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3); }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-200">
    <!-- 헤더 -->
    <div class="bg-zinc-900 border-b border-zinc-800 px-6 py-4">
        <div class="max-w-5xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-x-3">
                <div class="w-11 h-11 bg-blue-600 rounded-xl flex items-center justify-center">
                    <i class="fa-solid fa-drafting-compass text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold">청구범위to도면 변환봇</h1>
                    <p class="text-xs text-zinc-400">grok-imagine-image (서버 프록시)</p>
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-5xl mx-auto px-6 py-6">
        <div class="mb-6 bg-emerald-900/30 border border-emerald-700 rounded-2xl p-4 text-sm">
            <strong class="text-emerald-400">보안 적용 버전</strong> — API Key는 서버에서만 사용
        </div>

        <div class="bg-zinc-900 border border-zinc-700 rounded-3xl overflow-hidden shadow-2xl">
            <!-- 채팅 영역 -->
            <div id="chat-container" class="h-[520px] overflow-y-auto p-6 space-y-6 bg-zinc-950">
                <div class="flex gap-3">
                    <div class="w-8 h-8 bg-blue-600 rounded-full flex-shrink-0 flex items-center justify-center">
                        <i class="fa-solid fa-robot text-white text-sm"></i>
                    </div>
                    <div class="px-5 py-4 bg-zinc-800 rounded-2xl text-sm max-w-[80%]">
                        청구범위를 입력하면 Grok이 기술 도면을 생성합니다.<br>
                        (서버를 통해 안전하게 호출)
                    </div>
                </div>
            </div>

            <!-- 입력 영역 -->
            <div class="border-t border-zinc-700 p-4 bg-zinc-900">
                <div class="flex gap-3">
                    <textarea id="claim-input" class="flex-1 bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4 text-sm resize-none focus:outline-none focus:border-blue-500" rows="3" placeholder="특허청구범위를 입력하세요"></textarea>
                    <button onclick="generateDrawing()" class="px-8 bg-blue-600 hover:bg-blue-700 transition-colors rounded-2xl font-semibold flex items-center justify-center gap-2 min-w-[110px]">
                        <i class="fa-solid fa-image mr-2"></i> 도면 생성
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function addMessage(content, isUser = false, imageUrl = null) {
            const chat = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = `flex gap-3 ${isUser ? 'justify-end' : ''}`;

            if (isUser) {
                div.innerHTML = `<div class="px-5 py-4 bg-blue-600 rounded-2xl text-sm max-w-[80%]">${content}</div>`;
            } else {
                let html = `<div class="w-8 h-8 bg-blue-600 rounded-full flex-shrink-0 flex items-center justify-center"><i class="fa-solid fa-robot text-white text-sm"></i></div>
                            <div class="px-5 py-4 bg-zinc-800 rounded-2xl text-sm max-w-[80%]">${content}</div>`;
                
                if (imageUrl) {
                    html = `<div class="w-8 h-8 bg-blue-600 rounded-full flex-shrink-0 flex items-center justify-center"><i class="fa-solid fa-robot text-white text-sm"></i></div>
                            <div class="px-5 py-4 bg-zinc-800 rounded-2xl text-sm max-w-[80%]">
                                ${content}
                                <div class="mt-4"><img src="${imageUrl}" class="patent-drawing w-full rounded-xl"></div>
                            </div>`;
                }
                div.innerHTML = html;
            }
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function generateDrawing() {
            const claim = document.getElementById('claim-input').value.trim();
            if (!claim) return alert('청구범위를 입력하세요.');

            addMessage(claim, true);
            document.getElementById('claim-input').value = '';

            const chat = document.getElementById('chat-container');
            const loading = document.createElement('div');
            loading.className = `flex gap-3`;
            loading.innerHTML = `<div class="w-8 h-8 bg-blue-600 rounded-full flex-shrink-0 flex items-center justify-center"><i class="fa-solid fa-robot text-white text-sm"></i></div>
                                <div class="px-5 py-4 bg-zinc-800 rounded-2xl text-sm">도면 생성 중... (grok-imagine-image)</div>`;
            chat.appendChild(loading);
            chat.scrollTop = chat.scrollHeight;

            try {
                // 서버 프록시 호출 (API Key는 서버에서 처리)
                const res = await fetch('http://localhost:3005/api/grok', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: "grok-imagine-image",
                        prompt: `Technical patent drawing style, black and white line art, clear numbered component tags. ${claim}. Each component must have a clear number tag (1, 2, 3...) with name.`,
                        n: 1,
                        response_format: "url"
                    })
                });

                const data = await res.json();
                loading.remove();

                if (!res.ok) {
                    const errMsg = data.error?.message || JSON.stringify(data);
                    addMessage(`API 오류 (${res.status}): ${errMsg}`);
                    return;
                }

                const imageUrl = data.data?.[0]?.url;
                
                if (imageUrl) {
                    addMessage('도면 생성 완료 (구성요소 태그 포함)', false, imageUrl);
                } else {
                    addMessage('이미지 URL을 받지 못했습니다. 응답을 확인하세요.');
                }

            } catch (err) {
                loading.remove();
                addMessage(`오류: ${err.message}`);
                console.error(err);
            }
        }

        window.onload = function() {
            document.getElementById('claim-input').focus();
        }
    </script>
</body>
</html>
